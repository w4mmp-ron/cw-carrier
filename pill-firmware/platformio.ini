; Proficio on STM32F411 Black Pill — PlatformIO
; pio-async: copy of pio-claude (2026-10-04, commit 53239d6) with asynchronous
; USB audio (feedback endpoint). Output: release/BlackPill-25MHz-<version>-app.bin.
; Build:  cd firmware/pio-async && pio run
; Upload: pio run -t upload
;
; Bench test (bare Black Pill, no transceiver): see [env:bench] below.

[platformio]
; Plain `pio run` builds only the normal firmware, never the bench build.
default_envs = blackpill_f411ce

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
    -lm
    -D PROFICIO_FW_NAME=\"proficio-stm32f411-25MHz\"
    -D PROFICIO_CW_MKII=1
    -D USE_HAL_DRIVER
    -D STM32F411xE
    -D HSE_VALUE=25000000U
    -D CFG_TUSB_MCU=OPT_MCU_STM32F4
    -D CFG_TUSB_OS=OPT_OS_NONE
    -D CFG_TUSB_RHPORT0_MODE=OPT_MODE_DEVICE
    -D BOARD_TUD_RHPORT=0
    -I include
    -I third_party_tinyusb/src

extra_scripts =
    pre:extra_tinyusb.py

; HSE 25 MHz → PLLM=25, N=336, P=/4 → 84 MHz SYSCLK; Q=7 → 48 MHz USB
board_build.f_cpu = 84000000L
board_build.hse_value = 25000000

; App lives above 32KB flash DFU bootloader
board_build.ldscript = ld/STM32F411CEUX_APP_0x8000.ld
board_upload.offset_address = 0x08008000

; ---------------------------------------------------------------------------
; BENCH BUILD -- bare Black Pill, no transceiver / PCM3060 attached.
; Identical to the normal build except the PC13 Morse ladder ignores the
; codec I2C failure ("C"), so the I2S/DMA letters S / Z / O become visible.
;   Build:  pio run -e bench
;   Upload: pio run -e bench -t upload
; Output:  .pio/build/bench/firmware.bin and
;          release/proficio-stm32f411-25MHz-claude-bench-<date>.bin
; Do NOT use this build on the transceiver.
; ---------------------------------------------------------------------------
[env:bench]
extends = env:blackpill_f411ce
build_flags =
    ${env:blackpill_f411ce.build_flags}
    -D PROFICIO_BENCH_NO_CODEC=1
